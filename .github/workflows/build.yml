name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          cd app/build/outputs/apk/debug
          cp app-debug.apk yt-ad-autoskip-v1.0.0.apk
          sha256sum yt-ad-autoskip-v1.0.0.apk > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > release_notes.md
          ## What's Changed in v1.0.0

          Initial stable release of **yt-ad-autoskip** — an offline, privacy-first Android accessibility service that automates clicking "Skip Ad" in YouTube and YouTube Music.

          ### Key Features
          - **Automated Skip Dispatch:** Instantly triggers `ACTION_CLICK` as soon as the skip control becomes actionable.
          - **Accurate Actionable State Detection:** Distinguishes between countdown states and actionable controls, eliminating premature clicks.
          - **Zero Network Access:** 100% offline architecture with no `INTERNET` permission declared in the manifest.
          - **Material 3 Interface:** Modern dark console with real-time service status, persistent skip counters, and resource diagnostics.
          - **Minimal Resource Footprint:** Event-driven architecture with < 0.1% daily battery impact and ~16 MB RAM usage.

          ### Verification
          SHA-256 checksums are provided in `checksums-sha256.txt`.

          **Full Documentation:** [README.md](https://github.com/a-les/youtube-ad-autoskip#readme) | [README_RU.md](https://github.com/a-les/youtube-ad-autoskip/blob/main/README_RU.md)
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-ad-autoskip-v1.0.0
          path: |
            app/build/outputs/apk/debug/yt-ad-autoskip-v1.0.0.apk
            app/build/outputs/apk/debug/checksums-sha256.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/yt-ad-autoskip-v1.0.0.apk
            app/build/outputs/apk/debug/checksums-sha256.txt
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
